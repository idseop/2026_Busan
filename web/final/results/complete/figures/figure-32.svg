  <g id="text_36">
   <text style="font-weight: 700; font-size: 24px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #183c4c" x="60.48" y="46.08" transform="rotate(-0 60.48 46.08)">공개 조사표의 불량 판정과 비고를 구분했습니다</text>
  </g>
  <g id="text_37">
   <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #183c4c" x="60.48" y="86.4" transform="rotate(-0 60.48 86.4)">2026년 8월 · 4개 소방서 공개 조사표 132행 / 판정 131행 / 조사 연기 1행</text>
  </g>
  <g id="text_38">
   <text style="font-weight: 700; font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #168b86" x="60.48" y="443.52" transform="rotate(-0 60.48 443.52)">불량이 하나라도 기록된 19행 중 6행에 현지시정이 함께 기재되어 있습니다.</text>
  </g>
  <g id="text_39">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #183c4c" x="60.48" y="472.32" transform="rotate(-0 60.48 472.32)">13행은 일반 비고란의 공란입니다. 조치완료 전용 열이 아니므로 관리공백이나 현재 미조치의 증거가 아닙니다.</text>
  </g>
  <g id="text_40">
