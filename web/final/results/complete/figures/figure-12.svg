   <g id="text_11">
    <text style="font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #506c75" x="30.636" y="387.869971" transform="rotate(-0 30.636 387.869971)">두 수치는 병렬 조건이며, 121개 → 33개의 단계별 선별이 아님</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #147d82" x="36.1044" y="436.307078" transform="rotate(-0 36.1044 436.307078)">후속 근거를 깊게 연결한 설명 사례</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(36.1044 462.663809)">연산동·심정지, 부전동·교통사고는 325개 중의 사례. 광안동은 민감한 비교 사례.</text>
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(36.1044 479.641583)">서비스·현장 근거의 확보 수준을 함께 판단하며 위험도·정책 우선순위를 뜻하지 않음</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(530.604 282.904596)">유형별 추가 사례도 함께 유지</text>
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(530.604 303.213659)">주택화재 · 산악 · 수난</text>
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(530.604 323.613659)">최종 보고서에서 9개 사례 설명</text>
   </g>
