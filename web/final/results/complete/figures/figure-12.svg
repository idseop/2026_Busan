   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #193d49" x="7.2" y="29.277389" transform="rotate(-0 7.2 29.277389)">부산 전체 비교에서 설명 사례까지</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #193d49" x="7.2" y="57.36555" transform="rotate(-0 7.2 57.36555)">순위나 탈락표가 아니라, 비교 범위와 판단 근거를 구분한 과정</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #147d82" x="180.6264" y="95.553907" transform="rotate(-0 180.6264 95.553907)">970개 지역명·유형 조합</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #193d49" x="180.6264" y="122.016654" transform="rotate(-0 180.6264 122.016654)">194개 신고 지역명 × 5유형 · A/B/C 조건별 비교</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #147d82" x="36.1044" y="190.478005" transform="rotate(-0 36.1044 190.478005)">325개 · 선택 영향에 안정적인 조합</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(36.1044 217.13751)">세 처리조건 모두에서 결측 제외 전후</text>
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(36.1044 233.795439)">5년 반복과 2020→2024 증감 방향 유지</text>
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(36.1044 250.442588)">전체 신고 대표성이나 모든 시간 특징의 안정성을 뜻하지 않음</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #b16c34" x="539.9784" y="190.268005" transform="rotate(-0 539.9784 190.268005)">광안동 교통사고</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(539.9784 217.13751)">선택 안정성 미충족 · 별도 비교 사례</text>
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(539.9784 233.767588)">현장연구와 포장사업 근거로 검토</text>
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(539.9784 250.442588)">325개 통과 사례로 표시하지 않음</text>
   </g>
