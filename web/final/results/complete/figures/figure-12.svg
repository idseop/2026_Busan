   <g id="text_9">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #147d82" x="36.1044" y="321.926371" transform="rotate(-0 36.1044 321.926371)">325개 안에서 별도로 확인한 시기 민감도</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(36.1044 348.601422)">한 해씩 제외한 다섯 비교에서 최고시기 집합 유지</text>
    <text style="font-size: 11.5px; font-family: 'Malgun Gothic'; fill: #193d49" transform="translate(36.1044 365.021266)">최고계절 121개 / 최고월 33개 · C조건 달력일수당 접수</text>
   </g>
