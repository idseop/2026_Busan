  <g id="text_26">
   <text style="font-weight: 700; font-size: 18px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #243b4a" x="50.4" y="37.785375" transform="rotate(-0 50.4 37.785375)">부전시장 내부도로에서 체험복 착용 전후 시간 증가율이 가장 컸다</text>
  </g>
  <g id="text_27">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #243b4a" x="50.4" y="63.756" transform="rotate(-0 50.4 63.756)">2024.10.26~27 현장 실험 · 동일 조사원 조건 비교 · 4지역 × 내·외부도로 8개 집계</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; fill: #243b4a" transform="translate(50.4 481.764687)">내부도로(진한 녹색)와 외부도로(파란색)는 각 조사지역 안에서 구분한 것이다. 구간 길이와 현장 조건이 서로 다르다.</text>
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; fill: #243b4a" transform="translate(50.4 498.96)">노인체험복을 착용한 30대 조사원 실험이며, 실제 고령 주민의 평균이나 사고 원인을 입증하지 않는다.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 9px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #627580" x="50.4" y="534.996" transform="rotate(-0 50.4 534.996)">출처: 부산연구원(2025.3), PDF67·70쪽 · 신평 외부도로는 횡단 대기시간 포함 1구간 제외 · 반올림 평균으로 증가율을 재계산하지 않음</text>
  </g>
